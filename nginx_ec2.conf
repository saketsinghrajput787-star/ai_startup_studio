# Nginx configuration for FoundrAI on AWS EC2 (16.112.146.157)
# Place this file in /etc/nginx/sites-available/default or /etc/nginx/conf.d/foundrai.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 16.112.146.157 localhost _;

    # Frontend build root
    root /var/www/html;
    index index.html index.htm;

    # Maximum file upload size (for PDF uploads in knowledge base)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy to FastAPI backend (running on port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # LLM streaming and timeout allowances (60-120s)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Direct health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}
