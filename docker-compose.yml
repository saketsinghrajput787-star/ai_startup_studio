services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foundrai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-oss-120b}
      - TEMPERATURE=${TEMPERATURE:-0}
      - CHROMA_DB_PATH=app/chroma_db
      - KNOWLEDGE_BASE_PATH=../knowledge_base
      - UPLOAD_PATH=app/uploads/pdf
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-Saket7@#}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app/chroma_db:/app/app/chroma_db
      - ./backend/app/uploads:/app/app/uploads
      - ./knowledge_base:/knowledge_base

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foundrai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
